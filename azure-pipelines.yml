trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
  displayName: 'Use Python 3.11'

- script: |
    python --version
    pip install flask
  displayName: 'Install dependencies'

- script: |
    python app.py
  displayName: 'Run Python app'
