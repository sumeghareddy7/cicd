trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: aws-vars

steps:
- task: Docker@2
  inputs:
    command: build
    Dockerfile: '**/Dockerfile'
    repository: cicd-demo
    tags: latest

- script: |
    pip install awscli

    aws ecr get-login-password --region $(AWS_REGION) | docker login --username AWS --password-stdin $(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com

    docker tag cicd-demo:latest $(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/cicd-demo:latest

    docker push $(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/cicd-demo:latest
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)